name: Build Release ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-zip:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip

      - name: Install dependencies
        shell: pwsh
        run: |
          .\.venv\Scripts\python -m pip install -r requirements.txt
          .\.venv\Scripts\python -m pip install pyinstaller

      - name: Build release package
        shell: cmd
        run: build_release.bat

      - name: Upload release ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: synerion_attendance_release_zip
          path: release/synerion_attendance.zip
          if-no-files-found: error

      - name: Publish ZIP to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest Build
          body: Automated release package from the latest main build.
          allowUpdates: true
          prerelease: true
          artifacts: release/synerion_attendance.zip
          artifactErrorsFailBuild: true
          replacesArtifacts: true
